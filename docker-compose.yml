services:
  lamese-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: lamese-ai:0.1.0
    container_name: lamese-ai
    ports:
      - "8000:8000"
    environment:
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
    volumes:
      - "${FIREBASE_CREDENTIALS_PATH}:/run/secrets/firebase-service-account.json:ro"
    restart: unless-stopped